# Security and caching headers added by AWS Amplify to every response.
# The rest of the Content Security Policy is a <meta> tag in each page,
# generated by the template.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
  # Built assets have content hashes in their names, so they can be cached
  # for a year. A changed file gets a new name.
  - pattern: '/_astro/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
