# Pages CMS configuration: what editors see and can change.
# Same for every club; managed by the template. Keep it in step with the
# template's content.mjs schemas (field names and types must match).
#
# Images are saved in media/ and written into content as ../../media/<file>,
# which is how the template finds and optimises them.

media:
  input: media
  output: ../../media
  rename: safe
  extensions: [jpg, jpeg, png, webp]

components:
  # ---------- Shared pieces ----------
  linkItem:
    type: object
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - { name: page, label: Page on this site, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
      - { name: url, label: Or another address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }

  background:
    type: select
    label: Background
    default: white
    description: Ignored in the sidebar
    options:
      values:
        - { name: white, label: White }
        - { name: tint, label: Light tint }
        - { name: dark, label: Dark (club colour) }

  # ---------- Page blocks ----------
  text:
    type: object
    label: Text
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: body, label: Text, type: rich-text, options: { format: markdown, media: false } }

  image:
    type: object
    label: Image
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: image, label: Image, type: image, required: true }
      - name: alt
        label: Image description
        type: string
        required: true
        description: Describe the photo for people using screen readers, for example "Mt Buller lodge in winter"
      - { name: caption, label: Caption (optional), type: string }

  imageText:
    type: object
    label: Image with text
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: image, label: Image, type: image, required: true }
      - { name: alt, label: Image description, type: string, required: true }
      - { name: body, label: Text, type: rich-text, options: { format: markdown, media: false } }
      - name: imagePosition
        label: Image side
        type: select
        default: left
        options:
          values:
            - { name: left, label: Left }
            - { name: right, label: Right }
      - { name: buttonLabel, label: Button text (optional), type: string }
      - { name: buttonPage, label: Button goes to page, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
      - { name: buttonUrl, label: Or button goes to address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }

  photo:
    type: object
    label: Full-width photo
    fields:
      - { name: image, label: Photo, type: image, required: true, description: "Use a large photo, at least 2000 pixels wide" }
      - { name: alt, label: Image description, type: string, required: true }
      - { name: caption, label: Caption (optional), type: string }
      - name: height
        label: Height
        type: select
        default: medium
        options:
          values:
            - { name: medium, label: Medium }
            - { name: tall, label: Tall }

  facts:
    type: object
    label: Lodge facts
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - name: items
        label: Facts
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true, description: "For example: Beds" }
          - { name: value, label: Value, type: string, required: true, description: "For example: 26" }

  gallery:
    type: object
    label: Gallery
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - name: images
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image, required: true }
          - { name: alt, label: Image description, type: string, required: true }
          - { name: caption, label: Caption (optional), type: string }

  lodgeCards:
    type: object
    label: Lodge cards
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: intro, label: Intro text (optional), type: rich-text, options: { format: markdown, media: false } }
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: location, label: Where (optional), type: string, description: "For example: Mt Buller, 1,600 m" }
          - { name: image, label: Image, type: image }
          - { name: alt, label: Image description, type: string }
          - { name: body, label: Text, type: rich-text, options: { format: markdown, media: false } }
          - { name: page, label: Links to page, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
          - { name: url, label: Or links to address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }
          - { name: linkLabel, label: Link text (optional), type: string }

  cta:
    type: object
    label: Call to action
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: body, label: Text, type: rich-text, options: { format: markdown, media: false } }
      - { name: buttonLabel, label: Button text, type: string, required: true }
      - { name: buttonPage, label: Button goes to page, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
      - { name: buttonUrl, label: Or button goes to address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }

  map:
    type: object
    label: Map
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: name, label: Place name (optional), type: string }
      - { name: address, label: Address, type: text, required: true }
      - name: latitude
        label: Latitude (optional)
        type: number
        description: Right-click the spot in Google Maps and click the numbers to copy them. The first number is latitude.
      - { name: longitude, label: Longitude (optional), type: number, description: The second number. }
      - { name: zoom, label: Zoom (10 to 19), type: number, default: 16 }

  video:
    type: object
    label: Video
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: url, label: YouTube or Vimeo address, type: string, required: true }
      - { name: title, label: Video title, type: string, required: true }

  faq:
    type: object
    label: Questions and answers
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer, type: rich-text, required: true, options: { format: markdown, media: false } }

  tariffTable:
    type: object
    label: Tariff table
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - { name: caption, label: Table title (optional), type: string }
      - { name: columns, label: Column headings, type: string, list: true, required: true }
      - name: rows
        label: Rows
        type: object
        list: true
        fields:
          - { name: cells, label: Cells (one per column), type: string, list: true }
      - { name: note, label: Note under the table (optional), type: text }

  embed:
    type: object
    label: Embed (Google Form, YouTube, Vimeo, OpenStreetMap)
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - name: url
        label: Address
        type: string
        required: true
        description: For a Google Form, open the form, choose Send, then the <> tab, and copy the docs.google.com address
      - { name: title, label: Title, type: string, required: true }
      - { name: height, label: Height in pixels, type: number, default: 800 }

  contactList:
    type: object
    label: Contact list
    fields:
      - { name: heading, label: Heading (optional), type: string }
      - { name: background, component: background }
      - name: items
        label: Contacts
        type: object
        list: true
        fields:
          - { name: role, label: Role or topic, type: string, required: true }
          - { name: name, label: Name (optional), type: string }
          - { name: email, label: Email (optional), type: string }
          - { name: phone, label: Phone (optional), type: string }
          - { name: note, label: Note (optional), type: string }

  snowCams:
    type: object
    label: Snow cams
    fields:
      - name: heading
        label: Heading (optional)
        type: string
        description: Shows every camera switched on under Snow cams in the menu on the left
      - { name: background, component: background }

  blocks:
    type: block
    list: true
    blockKey: type
    blocks:
      - { name: text, label: Text, component: text }
      - { name: imageText, label: Image with text, component: imageText }
      - { name: image, label: Image, component: image }
      - { name: photo, label: Full-width photo, component: photo }
      - { name: gallery, label: Gallery, component: gallery }
      - { name: lodgeCards, label: Lodge cards, component: lodgeCards }
      - { name: facts, label: Lodge facts, component: facts }
      - { name: cta, label: Call to action, component: cta }
      - { name: map, label: Map, component: map }
      - { name: video, label: Video, component: video }
      - { name: faq, label: Questions and answers, component: faq }
      - { name: tariffTable, label: Tariff table, component: tariffTable }
      - { name: embed, label: Embed, component: embed }
      - { name: contactList, label: Contact list, component: contactList }
      - { name: snowCams, label: Snow cams, component: snowCams }

content:
  # ---------- Pages ----------
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: '{primary}.md'
    subfolders: false
    view:
      primary: title
      fields: [title, layout]
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - name: layout
        label: Layout
        type: select
        default: full
        options:
          values:
            - { name: full, label: Full width sections }
            - { name: sidebar, label: Main plus sidebar }
      - name: description
        label: Search description (optional)
        type: text
        description: One or two sentences shown in Google results
      - name: hero
        label: Top of page
        type: object
        fields:
          - name: style
            label: Style
            type: select
            default: none
            options:
              values:
                - { name: large, label: "Large: full-screen photo with title and buttons (home page)" }
                - { name: medium, label: "Medium: photo with the page title on it" }
                - { name: small, label: "Small: short photo strip (good for low-resolution photos)" }
                - { name: split, label: "Split: one photo beside the title" }
                - { name: none, label: No photo }
          - name: images
            label: Photos
            type: image
            description: More than one photo makes a slider. Large needs photos at least 2000 pixels wide.
            options:
              multiple: { max: 7 }
          - { name: title, label: Title on the photo (optional), type: string, description: Leave blank to use the page title }
          - { name: text, label: Text (optional), type: text }
          - { name: buttons, label: Buttons (up to 2), component: linkItem, list: { max: 2 } }
      - name: body
        label: Intro text
        type: rich-text
        options: { format: markdown, media: false }
      - { name: blocks, label: Page sections, component: blocks }
      - name: sidebar
        label: Sidebar sections
        component: blocks
        description: Only shown with the Main plus sidebar layout
      - name: hidden
        label: Hide this page
        type: boolean
        default: false
        description: Hidden pages are not published. Remove any menu link to them first.

  # ---------- Site settings ----------
  - name: site
    label: Site settings
    type: file
    path: content/settings/site.json
    format: json
    fields:
      - { name: name, label: Club name, type: string, required: true }
      - { name: url, label: Website address, type: string, required: true, readonly: true }
      - { name: description, label: Search description, type: text }
      - { name: logoOnLight, label: Logo for white backgrounds (header), type: image, required: true }
      - { name: logoOnDark, label: Logo for dark backgrounds (footer), type: image }
      - { name: icon, label: Square icon (browser tab), type: image }
      - name: colours
        label: Colours
        type: object
        description: Text colours are checked for readability. If one is too light the site won't update and you'll see why.
        fields:
          - { name: primary, label: Links and buttons, type: string, required: true }
          - { name: heading, label: Headings and menu, type: string, required: true }
          - { name: text, label: Body text, type: string, required: true }
          - { name: accent, label: Accent lines, type: string, required: true }
          - { name: dark, label: Footer background, type: string, required: true }
      - name: fonts
        label: Fonts
        type: select
        options:
          values:
            - { name: montserrat-source-sans, label: Montserrat headings with Source Sans text }
            - { name: inter, label: Inter throughout }
            - { name: lora-source-sans, label: Lora headings with Source Sans text }
            - { name: montserrat-inter, label: Montserrat headings with Inter text }
            - { name: system, label: Device fonts (fastest) }
      - name: look
        label: Look
        type: object
        fields:
          - name: header
            label: Header
            type: select
            default: solid
            options:
              values:
                - { name: solid, label: White header }
                - { name: overPhoto, label: "See-through header on top of large and medium photos" }
          - name: corners
            label: Corners
            type: select
            default: rounded
            options:
              values:
                - { name: rounded, label: Rounded }
                - { name: square, label: Square }
      - { name: menu, label: Menu, component: linkItem, list: true, required: true }
      - name: headerButton
        label: Header button
        type: object
        fields:
          - { name: show, label: Show button, type: boolean }
          - { name: label, label: Button text, type: string }
          - { name: page, label: Button goes to page, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
          - { name: url, label: Or button goes to address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }
      - name: bookingBand
        label: Booking band (above the footer on every page)
        type: object
        fields:
          - { name: show, label: Show band, type: boolean }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: buttonLabel, label: Button text, type: string }
          - { name: buttonPage, label: Button goes to page, type: reference, options: { collection: pages, value: "{path}", label: "{primary}" } }
          - { name: buttonUrl, label: Or button goes to address, type: string, description: "Only for other websites, email (mailto:) or phone (tel:). For a page on this site, choose it above." }
      - name: contact
        label: Contact details
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: postalAddress, label: Postal address, type: text }
          - { name: abn, label: ABN, type: string }
      - name: social
        label: Social media
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            required: true
            options:
              values:
                - { name: facebook, label: Facebook }
                - { name: instagram, label: Instagram }
                - { name: x, label: X (Twitter) }
                - { name: youtube, label: YouTube }
                - { name: linkedin, label: LinkedIn }
          - { name: url, label: Address, type: string, required: true }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: showContact, label: Show contact details, type: boolean }
          - { name: showSocial, label: Show social media, type: boolean }
          - { name: text, label: Footer text, type: rich-text, options: { format: markdown, media: false } }
          - { name: links, label: Footer links, component: linkItem, list: true }

  # ---------- Snow cams ----------
  - name: snowcams
    label: Snow cams
    type: file
    path: content/settings/snowcams.json
    format: json
    fields:
      - name: cameras
        label: Cameras
        type: object
        list: true
        fields:
          - { name: name, label: Camera name, type: string, required: true }
          - { name: url, label: Image address, type: string, required: true, readonly: true }
          - { name: enabled, label: Show on the website, type: boolean }
          - { name: caption, label: Caption (optional), type: string }
